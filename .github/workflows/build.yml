name: Build APK from ZIP to APK Folder

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip archive and fix project structure
      run: |
        if [ -f "smart-ai-search.zip" ]; then
          echo "Unzipping smart-ai-search.zip..."
          unzip -o smart-ai-search.zip -d temp_unzip
          if [ $(ls -1 temp_unzip | wc -l) -eq 1 ] && [ -d temp_unzip/* ]; then
            cp -r temp_unzip/*/* . 2>/dev/null || true
            cp -r temp_unzip/*/. . 2>/dev/null || true
          else
            cp -r temp_unzip/* . 2>/dev/null || true
          fi
          rm -rf temp_unzip
        fi

    - name: Setup Gradle 9.3.1 Wrapper
      run: |
        gradle wrapper --gradle-version 9.3.1 --distribution-type bin

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Generate debug keystore
      run: |
        keytool -genkeypair \
          -v \
          -keystore "$GITHUB_WORKSPACE/debug.keystore" \
          -storepass android \
          -keypass android \
          -alias androiddebugkey \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -dname "CN=Android Debug,O=Android,C=US"

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Copy APK to apk folder
      run: |
        mkdir -p apk
        find app/build/outputs/apk/ -name "*.apk" -exec cp {} apk/app-debug.apk \;

    - name: Commit and Push APK
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add apk/
        git diff-index --quiet HEAD || git commit -m "auto: update built APK in apk folder"
        git push origin main
