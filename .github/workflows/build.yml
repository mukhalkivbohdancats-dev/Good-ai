name: Build APK from ZIP to APK Folder

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: main

    - name: Unzip uploaded archive if present
      run: |
        if [ -f "smart-ai-search.zip" ]; then
          echo "Unzipping smart-ai-search.zip..."
          unzip -o smart-ai-search.zip -d .
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Compatible Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 8.4 || true

    - name: Make gradlew executable
      run: chmod +x gradlew || true

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Copy APK to apk folder
      run: |
        mkdir -p apk
        find app/build/outputs/apk/ -name "*.apk" -exec cp {} apk/app-debug.apk \;

    - name: Commit and Push APK
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add apk/
        git diff-index --quiet HEAD || git commit -m "auto: update built APK in apk folder"
        git push origin main
