name: Build APK to Folder

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Compatible Gradle Wrapper
      run: gradle wrapper --gradle-version 8.4

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Copy APK to apk's folder
      run: |
        mkdir -p "apk's"
        cp app/build/outputs/apk/debug/*.apk "apk's/app-debug.apk"

    - name: Commit and Push APK
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add "apk's/"
        git commit -m "auto: update built APK in apk's folder" || exit 0
        git push
